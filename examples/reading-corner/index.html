<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozy Reading Corner</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1511; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #credits {
    position: fixed; left: 16px; bottom: 16px; max-width: min(460px, calc(100vw - 32px));
    max-height: 40vh; overflow: auto; padding: 12px 14px; border-radius: 10px;
    background: rgba(20, 14, 10, 0.72); color: #f1e6d6; font-size: 12px; line-height: 1.45;
    backdrop-filter: blur(6px);
  }
  #credits h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  #credits ul { margin: 0; padding-left: 16px; }
  #credits li { margin-bottom: 4px; }
  #credits a { color: #f4c98b; }
  #status { position: fixed; top: 16px; left: 16px; color: #f1e6d6; font-size: 13px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="status">Loading…</div>
<div id="credits"><h2>Credits</h2><ul id="credit-list"></ul></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const AMAZON_CREDIT = 'Amazon Berkeley Objects by Amazon.com (amazon-berkeley-objects.s3.amazonaws.com), CC BY 4.0. Converted to GLB by CodePawl.';
const BASE = 'https://assets.codepawl.com/f/';

// size_m is [x, y, z] in metres from get_asset; null means "longest side 1 unit" (scaled to targetLongest).
const ASSETS = [
  { name: 'Armchair', id: 'abo-glb:B0714QGLSD', url: BASE + 'abo-glb/B0714QGLSD/web.glb', size_m: [0.8454, 0.9679, 0.9421], credit: AMAZON_CREDIT,
    position: [0.2, 0, -0.5], rotationY: 0.45 },
  { name: 'Floor lamp', id: 'abo-glb:B07374C6R9', url: BASE + 'abo-glb/B07374C6R9/web.glb', size_m: [0.4198, 1.475, 0.4198], credit: AMAZON_CREDIT,
    position: [-0.85, 0, -1.2], rotationY: 0 },
  { name: 'Side table', id: 'abo-glb:B072ZK887F', url: BASE + 'abo-glb/B072ZK887F/web.glb', size_m: [0.4003, 0.6232, 0.3998], credit: AMAZON_CREDIT,
    position: [1.15, 0, -0.9], rotationY: 0.3 },
  { name: 'Bookshelf', id: 'abo-glb:B07PQQRST8', url: BASE + 'abo-glb/B07PQQRST8/web.glb', size_m: [0.77, 1.5, 0.35], credit: AMAZON_CREDIT,
    position: [0.2, 0, -2.2], rotationY: 0 },
  { name: 'Rug', id: 'objaverse-clean-glb:persian-tabriz-pictorial-carpet-0ce2fc1e',
    url: BASE + 'objaverse-clean-glb/persian-tabriz-pictorial-carpet-0ce2fc1e/engine.glb', size_m: null, targetLongest: 2.4,
    credit: '"Persian Tabriz Pictorial Carpet" by mfb64 (https://sketchfab.com/3d-models/0ce2fc1e54724cb79cbb08ab2182760a), CC-BY-4.0. From Objaverse 1.0 (Allen Institute for AI); scaled and converted to GLB by CodePawl.',
    position: [0.3, 0.005, -0.2], rotationY: 0.15, flat: true },
  { name: 'Plant pot', id: 'abo-glb:B075HR7LHQ', url: BASE + 'abo-glb/B075HR7LHQ/web.glb', size_m: [0.1603, 0.1555, 0.1603], credit: AMAZON_CREDIT,
    position: [1.15, 0.6232, -0.9], rotationY: 0 },
];
const HDRI = {
  id: 'polyhaven:pine_attic',
  url: 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/pine_attic_1k.hdr',
  credit: 'Pine Attic from Poly Haven (polyhaven.com), CC0. Powered by Poly Haven.',
};

// Credits overlay
const creditList = document.getElementById('credit-list');
for (const entry of [...ASSETS, { name: 'HDRI lighting', credit: HDRI.credit }]) {
  const item = document.createElement('li');
  item.textContent = `${entry.name}: ${entry.credit}`;
  creditList.appendChild(item);
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2018);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 50);
camera.position.set(2.6, 1.7, 3.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.2, 0.7, -0.8);
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 1.5;
controls.maxDistance = 7;
controls.enableDamping = true;

// Room: floor and two walls (4 m x 4 m)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(5, 5),
  new THREE.MeshStandardMaterial({ color: 0x9b7650, roughness: 0.7 }));
floor.rotation.x = -Math.PI / 2;
floor.position.set(0.2, 0, 0);
floor.receiveShadow = true;
scene.add(floor);
const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xd8c3a5, roughness: 0.95 });
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(5, 2.8), wallMaterial);
backWall.position.set(0.2, 1.4, -2.5);
backWall.receiveShadow = true;
scene.add(backWall);
const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(5, 2.8), wallMaterial);
leftWall.rotation.y = Math.PI / 2;
leftWall.position.set(-2.3, 1.4, 0);
leftWall.receiveShadow = true;
scene.add(leftWall);

// HDRI lighting
new RGBELoader().load(HDRI.url, (texture) => {
  texture.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = texture;
  scene.environmentIntensity = 0.7;
});

// Lights: soft window sun and warm lamp glow
const sun = new THREE.DirectionalLight(0xfff0d8, 1.4);
sun.position.set(3, 4, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 12 });
sun.shadow.bias = -0.0005;
scene.add(sun);
const lampGlow = new THREE.PointLight(0xffb866, 2.5, 4, 2);
lampGlow.position.set(-0.85, 1.3, -1.2);
scene.add(lampGlow);

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

function placeAsset(entry, gltf) {
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());

  if (entry.flat && size.z < size.y) {
    // Rug authored standing up: lay it down so its thinnest axis is vertical.
    model.rotation.x = -Math.PI / 2;
    model.updateMatrixWorld(true);
    box.setFromObject(model);
    box.getSize(size);
  }

  let scale = 1;
  if (entry.size_m) {
    scale = entry.size_m[1] / size.y;           // real height in metres
  } else {
    scale = entry.targetLongest / Math.max(size.x, size.y, size.z);
  }
  model.scale.setScalar(scale);
  model.updateMatrixWorld(true);
  box.setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.set(-center.x, -box.min.y, -center.z);

  const holder = new THREE.Group();
  holder.add(model);
  holder.position.set(...entry.position);
  holder.rotation.y = entry.rotationY;
  model.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = !entry.flat;
      child.receiveShadow = true;
    }
  });
  scene.add(holder);
}

const status = document.getElementById('status');
Promise.all(ASSETS.map((entry) => loader.loadAsync(entry.url).then((gltf) => placeAsset(entry, gltf))))
  .then(() => status.remove())
  .catch((error) => { status.textContent = 'Failed to load: ' + error.message; console.error(error); });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
